<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign-up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <div class="top-logo">
         <div class="logo-content">
             <img src="/asset/odin-lined.png" alt="odin logo">
             <h1>ODIN</h1>
         </div>
        </div>
        <div class="sign-up">
           <div class="sign-up-note">
            <p>This is not a real online service, you know you need service like this to help you  realize your deepest deream. <br>
            sin-up to get started.   
            <p style="padding-top:10px;">you know you want to.</p> 
            </p>
           </div>
           <div class="sign-up-form">
            <h1>let's do it</h1>
            <div class="sign-up-name">
            <div class="first-name">
                   <label for="fname">FIRST NAME</label>
                <input type="text" id="fname" name="fname">
            </div>
                <div class="last-name">
                    <label for="lname">LAST NAME</label>
                    <input type="text" id="lname" name="lname">
                </div>
            </div>
            <div class="contact-infor">
                <div class="email">
                    <label for="email">EMAIL</label>
                   <input type="email" id="email" name="email">
                </div>
                <div class="phone-number">
                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="number" id="phone-number" name="phone-number" max="11">
                </div>
            </div>
             <div class="password">
                <div class="main-password">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" name="password" required>
             </div>
                <div class="comfirm-password">
                    <label for="cpassword">COMFIRM PASSWORD</label>
                    <input type="password" id="cpassword" name="comf-password" required>
                </div>
             </div>

           </div>
           <button type="submit">Create Account</button>
           <div class="call-log-in">
            <h1>Already haave an account? <span style="font-weight: bold;">Log in</span></h1>
           </div>
    </div>
</body>
</html>
